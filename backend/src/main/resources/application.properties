spring.application.name=blog-backend

# --- Datenbank: bestehende XAMPP-MariaDB "blog" ---
# XAMPP-Default: Benutzer root ohne Passwort. In Produktion niemals so.
spring.datasource.url=jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Berlin
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# ddl-auto=none: Das Schema existiert bereits, Hibernate fasst es nicht an.
# (In Phase 1 ggf. auf "validate" hochstufen, sobald die Entities zum Schema passen.)
spring.jpa.hibernate.ddl-auto=none
# open-in-view=false ist Best Practice: Lazy-Loading nur innerhalb der Service-Transaktion.
spring.jpa.open-in-view=false
# Beim Entwickeln praktisch, um die generierten SQL-Statements zu sehen:
spring.jpa.show-sql=true

# --- Datei-Upload: Bilder kommen jetzt als Base64-Data-URL im JSON-Body an.
# Das 5-MB-Limit wird im FileStorageService auf den dekodierten Bytes geprueft. ---

# --- Speicherort fuer hochgeladene Bilder (relativ zum Arbeitsverzeichnis des Backends) ---
app.uploads.dir=uploads

# --- CORS: erlaubte Frontend-Origins (kommagetrennt) ---
# Fuer eine andere Maschine hier den/die passenden Origin(s) eintragen,
# z. B. http://192.168.1.50 oder https://blog.example.com.
app.cors.allowed-origins=http://localhost,http://127.0.0.1,http://localhost:5500,http://127.0.0.1:5500
