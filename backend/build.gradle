plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.14.0'
}

group = 'de.essenmeile'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
	testCompileOnly 'org.projectlombok:lombok:1.18.38'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// Sorgt dafuer, dass Lombok VOR MapStruct laeuft (sonst sieht MapStruct die
	// Lombok-Getter/Setter nicht und erzeugt leere Mappings).
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Deprecation-Warnungen im Detail anzeigen (hilfreich beim Lernen/Aktuellhalten).
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:deprecation'
}

// --- Contract-first: Modelle + API-Interfaces aus post-api.yaml generieren ---
openApiGenerate {
	generatorName = 'spring'
	inputSpec = "$projectDir/src/main/resources/post-api.yaml".toString()
	outputDir = "$projectDir/build/generated/openapi".toString()
	apiPackage = 'de.essenmeile.blog.api'
	modelPackage = 'de.essenmeile.blog.api.model'
	configOptions = [
		interfaceOnly        : 'true',   // nur Interfaces + Modelle, keine fertigen Controller
		useSpringBoot3       : 'true',   // Jakarta-Imports (gilt auch fuer Boot 4)
		useJakartaEe         : 'true',
		useTags              : 'true',   // ein Interface pro Tag (PostsApi, UploadsApi)
		dateLibrary          : 'java8-localdatetime', // date-time -> LocalDateTime (wie die Entity)
		openApiNullable      : 'false',  // kein Extra-JsonNullable-Wrapper
		documentationProvider: 'none'
	]
}

// Generierte Quellen (Interfaces + Modelle) in den Haupt-Sourceset aufnehmen
// und sicherstellen, dass vor dem Kompilieren generiert wird.
sourceSets.main.java.srcDir "$projectDir/build/generated/openapi/src/main/java"

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}
