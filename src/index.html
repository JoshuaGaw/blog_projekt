<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essen in Köln</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Header -->
<header class="header">
    <div class="header-content">
        <h1 id="headername">
            KÖLN ESSENMEILE
        </h1>
        <div class="search-wrapper">
            <input type="text" id="search-input" class="search-input" placeholder="Suchen…">
        </div>
        <button id="new-post-button" title="Neuer Eintrag">＋</button>
        <button id="theme-toggle" class="darkmode-toggle" title="Dark/Light Mode">☀️</button>
    </div>
</header>

<!-- Pop-Up -->
<div id="new-post-container" class="display-none pop-up">
    <div class="pop-up-card">
        <div class="new-post-header-title">Neuer Post</div>
        <div class="pop-up-content">
            <div class="display-flex-column padding-10">
                <label class="label" for="new-post-title">Titel (max. 32 Zeichen)</label>
                <input class="input-field height-30" type="text" id="new-post-title" maxlength="32" required>
                <div id="new-post-title-error" class="image-error display-none"></div>
            </div>
            <div class="display-flex-column padding-10">
                <label class="label" for="new-post-description">Beschreibung (max. 180 Zeichen)</label>
                <textarea class="input-field height-80" id="new-post-description" maxlength="180"></textarea> 
            </div>
            <div class="display-flex-column padding-10">
                    <label class="label" for="new-post-content">Inhalt (max. 2000 Zeichen)</label>
                    <textarea class="input-field height-200" id="new-post-content" maxlength="2000"></textarea>
                </div>
                <div class="display-flex-column padding-10">
                    <label class="label" for="new-post-image">Bild (max. 5 MB)</label>
                    <input class="input-field" type="file" id="new-post-image" accept="image/*">
                    <div id="new-post-image-error" class="image-error display-none"></div>
                    <img id="new-post-image-preview" class="image-preview display-none" src="" alt="Vorschau">
                </div>
        </div>
        <div class="pop-up-footer">
            <button id="new-post-cancel" class="button">Abbrechen</button>
            <button id="new-post-submit" class="button">Speichern</button>
        </div>
    </div>
</div>

<!-- Karten -->
<main class="main-content">
    <div id="hero-container"></div>
    <div id="posts-container"></div>
</main>

<script src="common.js"></script>
<script src="startseite-script.js"></script>
</body>
</html>
